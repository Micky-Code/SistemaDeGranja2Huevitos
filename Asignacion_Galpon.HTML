<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Independiente - Asignación Galpón</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-success text-white py-3">
      <h4 class="mb-0"><i class="bi bi-house-door-fill me-2"></i>Asignación de Galpón</h4>
    </div>
    <div class="card-body">
      <!-- FORMULARIO INDEPENDIENTE ASIGNACION GALPON -->
      <form id="formAsignacion" onsubmit="guardarAsignacion(event)">
        <input type="hidden" id="asig_index">
        <div class="row g-3">
          <div class="col-md-2">
            <label for="asig_id" class="form-label font-monospace">ID Asignación *</label>
            <input type="number" class="form-control" id="asig_id" required placeholder="Ej: 501">
          </div>
          <div class="col-md-4">
            <label for="asig_personal" class="form-label">Personal (FK) *</label>
            <select class="form-select" id="asig_personal" required>
              <!-- Carga dinámicamente el personal registrado -->
            </select>
          </div>
          <div class="col-md-3">
            <label for="asig_galpon" class="form-label">Galpón Destino *</label>
            <input type="text" class="form-control" id="asig_galpon" required placeholder="Ej: Galpón A-1">
          </div>
          <div class="col-md-3">
            <label for="asig_tipo" class="form-label">Tipo Asignación *</label>
            <select class="form-select" id="asig_tipo" required>
              <option value="" disabled selected>Seleccione...</option>
              <option value="PRINCIPAL">PRINCIPAL</option>
              <option value="PIVOTE">PIVOTE</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="asig_fechaInicio" class="form-label">Fecha Inicio *</label>
            <input type="date" class="form-control" id="asig_fechaInicio" required>
          </div>
          <div class="col-md-6">
            <label for="asig_fechaFin" class="form-label">Fecha Fin *</label>
            <input type="date" class="form-control" id="asig_fechaFin" required>
          </div>
          <div class="col-12 text-end mt-3">
            <button type="button" class="btn btn-outline-secondary me-2" onclick="limpiarFormAsig()">
              <i class="bi bi-x-circle me-1"></i> Cancelar
            </button>
            <button type="submit" class="btn btn-success" id="btnGuardarAsig">
              <i class="bi bi-save me-1"></i> Guardar Asignación
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- TABLA DE REGISTROS -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3">
      <h5 class="mb-0 text-secondary">Historial de Asignaciones a Galpones</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Personal Asignado</th>
              <th>Galpón</th>
              <th>Tipo</th>
              <th>Período</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaAsigBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let listaPersonal = JSON.parse(localStorage.getItem('db_personal')) || [];
  let listaAsignaciones = JSON.parse(localStorage.getItem('db_asignaciones')) || [];

  function cargarComboPersonal() {
    const select = document.getElementById('asig_personal');
    select.innerHTML = '<option value="" disabled selected>Seleccione Personal...</option>';
    listaPersonal.forEach(p => {
      select.innerHTML += `<option value="${p.idPersonal}">${p.nombres} ${p.apellidos} (${p.tipo})</option>`;
    });
  }

  function renderTablaAsig() {
    const tbody = document.getElementById('tablaAsigBody');
    tbody.innerHTML = '';
    if (listaAsignaciones.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">No hay asignaciones registradas.</td></tr>`;
      return;
    }
    listaAsignaciones.forEach((item, index) => {
      const p = listaPersonal.find(x => x.idPersonal == item.idPersonal);
      const nombrePersonal = p ? `${p.nombres} ${p.apellidos}` : `ID: ${item.idPersonal} (No encontrado)`;
      tbody.innerHTML += `
        <tr>
          <td class="fw-bold">${item.idAsignacion}</td>
          <td>${nombrePersonal}</td>
          <td><span class="badge bg-secondary">${item.galpon}</span></td>
          <td><span class="badge ${item.tipoAsignacion === 'PRINCIPAL' ? 'bg-success' : 'bg-warning text-dark'}">${item.tipoAsignacion}</span></td>
          <td><small>${item.fechaInicio} al ${item.fechaFin}</small></td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning me-1" onclick="editarAsig(${index})"><i class="bi bi-pencil"></i> Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="eliminarAsig(${index})"><i class="bi bi-trash"></i> Eliminar</button>
          </td>
        </tr>`;
    });
  }

  function guardarAsignacion(e) {
    e.preventDefault();
    const idx = document.getElementById('asig_index').value;
    const data = {
      idAsignacion: document.getElementById('asig_id').value,
      idPersonal: document.getElementById('asig_personal').value,
      galpon: document.getElementById('asig_galpon').value,
      tipoAsignacion: document.getElementById('asig_tipo').value,
      fechaInicio: document.getElementById('asig_fechaInicio').value,
      fechaFin: document.getElementById('asig_fechaFin').value
    };

    if (idx === "") {
      if (listaAsignaciones.some(a => a.idAsignacion == data.idAsignacion)) {
        alert("El ID de Asignación ya existe.");
        return;
      }
      listaAsignaciones.push(data);
    } else {
      listaAsignaciones[idx] = data;
    }

    localStorage.setItem('db_asignaciones', JSON.stringify(listaAsignaciones));
    limpiarFormAsig();
    renderTablaAsig();
  }

  function editarAsig(index) {
    const item = listaAsignaciones[index];
    document.getElementById('asig_index').value = index;
    document.getElementById('asig_id').value = item.idAsignacion;
    document.getElementById('asig_id').disabled = true;
    document.getElementById('asig_personal').value = item.idPersonal;
    document.getElementById('asig_galpon').value = item.galpon;
    document.getElementById('asig_tipo').value = item.tipoAsignacion;
    document.getElementById('asig_fechaInicio').value = item.fechaInicio;
    document.getElementById('asig_fechaFin').value = item.fechaFin;
    document.getElementById('btnGuardarAsig').innerHTML = '<i class="bi bi-check-circle me-1"></i> Actualizar Asignación';
  }

  function eliminarAsig(index) {
    if (confirm("¿Desea eliminar esta asignación?")) {
      listaAsignaciones.splice(index, 1);
      localStorage.setItem('db_asignaciones', JSON.stringify(listaAsignaciones));
      renderTablaAsig();
    }
  }

  function limpiarFormAsig() {
    document.getElementById('formAsignacion').reset();
    document.getElementById('asig_index').value = "";
    document.getElementById('asig_id').disabled = false;
    document.getElementById('btnGuardarAsig').innerHTML = '<i class="bi bi-save me-1"></i> Guardar Asignación';
  }

  document.addEventListener('DOMContentLoaded', () => {
    cargarComboPersonal();
    renderTablaAsig();
  });
</script>
</body>
</html>
