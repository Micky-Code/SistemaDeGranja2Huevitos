<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avícola UPN - Producción</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Control Avícola UPN</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="produccion.html" class="active">Producción</a>
            <a href="almacen.html">Almacén</a>
            <a href="sanidad.html">Sanidad</a>
        </nav>
    </header>

    <main class="container">
        <h2>Registro de Producción Diaria</h2>
        <form class="card-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div class="form-group">
                    <label for="galpon">Galpón:</label>
                    <select id="galpon" name="galpon" required>
                        <option value="1">Galpón 01</option>
                        <option value="2">Galpón 02</option>
                    </select>
                </div>
            </div>
            
            <h3>Mortalidad y Alimento</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="mortalidad">Aves Muertas / Descarte:</label>
                    <input type="number" id="mortalidad" name="mortalidad" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="tipo-alimento">Tipo de Alimento:</label>
                    <select id="tipo-alimento" name="tipo_alimento">
                        <option value="postura_1">Postura FASE 1</option>
                        <option value="postura_2">Postura FASE 2</option>
                        <option value="crecimiento">Crecimiento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="alimento">Alimento (Kg):</label>
                    <input type="number" id="alimento" name="alimento" step="0.1" min="0">
                </div>
            </div>

            <h3>Clasificación de Huevo (Unidades)</h3>
            <div class="grid-inputs">
                <div class="form-group"><label>Rojo:</label><input type="number" min="0" value="0"></div>
                <div class="form-group"><label>Pardo:</label><input type="number" min="0" value="0"></div>
                <div class="form-group"><label>Jumbo:</label><input type="number" min="0" value="0"></div>
                <div class="form-group"><label>Doble Yema:</label><input type="number" min="0" value="0"></div>
                <div class="form-group"><label>Poroso:</label><input type="number" min="0" value="0"></div>
                <div class="form-group"><label>Roto/Mermado:</label><input type="number" min="0" value="0"></div>
            </div>

            <button type="submit" class="btn">Guardar Registro</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
