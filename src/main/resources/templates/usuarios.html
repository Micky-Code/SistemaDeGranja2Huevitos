<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Granja 2 Huevitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/menu.js}" defer></script>
    <script th:src="@{/js/usuarios.js}" defer></script>
</head>
<body class="menu-page">
<header class="bg-white border-bottom">
    <nav class="container d-flex align-items-center justify-content-between py-3" aria-label="Principal">
        <a class="brand-mark text-decoration-none" th:href="@{/menu}"><span aria-hidden="true">●</span> Granja 2 Huevitos</a>
        <div class="d-flex align-items-center gap-3">
            <span class="d-none d-sm-inline text-secondary">Hola, <strong class="text-dark" th:text="${username}">Usuario</strong></span>
            <button id="logout-button" type="button" class="btn btn-outline-success btn-sm">Cerrar sesión</button>
        </div>
    </nav>
</header>
<main class="container py-5">
    <a th:href="@{/menu}" class="text-success text-decoration-none">← Volver al menú</a>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3 mb-4">
        <div><span class="eyebrow">Administración</span><h1 class="display-6 fw-bold mt-2 mb-0">Usuarios</h1></div>
        <button id="new-user" class="btn btn-success" type="button">Crear usuario</button>
    </div>
    <div id="logout-error" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
    <div id="users-message" class="alert d-none" role="alert" aria-live="polite"></div>
    <section class="menu-card p-4 mb-4" aria-labelledby="form-title" id="user-panel" hidden>
        <h2 class="h5 fw-bold" id="form-title">Crear usuario</h2>
        <form id="user-form" class="row g-3 mt-1">
            <div class="col-md-6"><label class="form-label" for="username">Usuario</label><input id="username" name="username" class="form-control" maxlength="50" required autocomplete="off"></div>
            <div class="col-md-6"><label class="form-label" for="password">Contraseña</label><input id="password" name="password" type="password" class="form-control" minlength="7" autocomplete="new-password"><div id="password-help" class="form-text">Mínimo 7 caracteres.</div></div>
            <div class="col-md-6"><label class="form-label" for="role">Rol</label><select id="role" name="idRol" class="form-select" required></select></div>
            <div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input id="active" name="estado" type="checkbox" class="form-check-input" checked><label class="form-check-label" for="active">Usuario activo</label></div></div>
            <div class="col-12 d-flex gap-2"><button id="save-user" type="submit" class="btn btn-success">Guardar</button><button id="cancel-user" type="button" class="btn btn-outline-secondary">Cancelar</button></div>
        </form>
    </section>
    <section class="menu-card p-4" aria-labelledby="list-title">
        <h2 class="h5 fw-bold mb-3" id="list-title">Cuentas registradas</h2>
        <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="users-list"><tr><td colspan="4">Cargando usuarios…</td></tr></tbody></table></div>
    </section>
</main>
</body>
</html>
