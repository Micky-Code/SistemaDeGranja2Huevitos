<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportes | Granja 2 Huevitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/reportes.js}" defer></script>
</head>
<body class="menu-page">
<header class="bg-white border-bottom">
    <nav class="container d-flex align-items-center justify-content-between py-3" aria-label="Principal">
        <a class="brand-mark text-decoration-none" th:href="@{/menu}"><span aria-hidden="true">●</span> Granja 2 Huevitos</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/menu}" class="btn btn-outline-secondary btn-sm">&larr; Menú</a>
            <span class="d-none d-sm-inline text-secondary">Hola, <strong class="text-dark" th:text="${username}">Usuario</strong></span>
            <button id="logout-button" type="button" class="btn btn-outline-success btn-sm">Cerrar sesión</button>
        </div>
    </nav>
</header>
<main class="container py-5">
    <div class="mb-4 d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
            <span class="eyebrow">Menú</span>
            <h1 class="display-6 fw-bold mt-2 mb-2">Reportes</h1>
            <p class="text-secondary mb-0">Genera y consulta los reportes del sistema.</p>
        </div>
        <button id="generar-button" type="button" class="btn btn-success">
            <span id="generar-spinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
            Generar reporte de mermas (Almacén)
        </button>
    </div>

    <div id="feedback" class="alert d-none" role="alert" aria-live="polite"></div>

    <article class="menu-card p-4">
        <h2 class="h5 fw-bold mb-3">Historial de reportes</h2>
        <div id="reportes-lista">
            <p class="text-secondary">Cargando reportes...</p>
        </div>
    </article>
</main>
</body>
</html>
