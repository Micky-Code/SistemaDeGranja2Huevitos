<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infraestructura - La Granja 2 Huevitos</title>
    
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white border-bottom px-4 py-3 mb-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-success fs-4">🥚 La Granja 2 Huevitos</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small">Usuario: <strong th:text="${username}">Usuario</strong></span>
                <a th:href="@{/menu}" class="btn btn-outline-success btn-sm">Menú Principal</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h3 class="fw-bold text-success mb-4">🏡 Módulo 3: Infraestructura</h3>

        <div class="row g-4">
            <!-- 1. Sector -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
                    <h5 class="fw-bold mb-3 text-secondary">Gestión de Sectores</h5>
                    <form id="form-sector" class="mb-4">
                        <input type="hidden" id="sec-id" value="">
                        <div class="mb-3">
                            <label for="sec-nombre" class="form-label">Nombre del Sector</label>
                            <input type="text" id="sec-nombre" class="form-control" placeholder="Ej: Sector Norte" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" id="btn-guardar-sector" class="btn btn-success flex-fill fw-semibold">Guardar Sector</button>
                            <button type="button" id="btn-cancelar-edicion" class="btn btn-outline-secondary flex-fill fw-semibold d-none" onclick="cancelarEdicionSector()">Cancelar</button>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Nombre</th><th class="text-center">Acciones</th></tr>
                            </thead>
                            <tbody id="tb-sectores"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 2. Galpon -->
			<!-- 2. Galpón (Actualizado con selector estricto de G-01 a G-20) -->
			<div class="col-lg-6">
			    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
			        <h5 class="fw-bold mb-3 text-secondary">Gestión de Galpones</h5>
			        <form id="form-galpon" class="mb-4">
			            <div class="mb-3">
			                <label for="gal-nombre" class="form-label">Nombre del Galpón</label>
			                <select id="gal-nombre" class="form-select" required>
			                    <option value="">Seleccione Galpón</option>
			                    <!-- Script generará o colocamos estricto -->
			                    <option value="Galpón G-01">Galpón G-01</option>
			                    <option value="Galpón G-02">Galpón G-02</option>
			                    <option value="Galpón G-03">Galpón G-03</option>
			                    <option value="Galpón G-04">Galpón G-04</option>
			                    <option value="Galpón G-05">Galpón G-05</option>
			                    <option value="Galpón G-06">Galpón G-06</option>
			                    <option value="Galpón G-07">Galpón G-07</option>
			                    <option value="Galpón G-08">Galpón G-08</option>
			                    <option value="Galpón G-09">Galpón G-09</option>
			                    <option value="Galpón G-10">Galpón G-10</option>
			                    <option value="Galpón G-11">Galpón G-11</option>
			                    <option value="Galpón G-12">Galpón G-12</option>
			                    <option value="Galpón G-13">Galpón G-13</option>
			                    <option value="Galpón G-14">Galpón G-14</option>
			                    <option value="Galpón G-15">Galpón G-15</option>
			                    <option value="Galpón G-16">Galpón G-16</option>
			                    <option value="Galpón G-17">Galpón G-17</option>
			                    <option value="Galpón G-18">Galpón G-18</option>
			                    <option value="Galpón G-19">Galpón G-19</option>
			                    <option value="Galpón G-20">Galpón G-20</option>
			                </select>
			            </div>
			            <div class="row g-2 mb-3">
			                <div class="col-md-6">
			                    <label for="gal-capacidad" class="form-label">Capacidad (Aves)</label>
			                    <input type="number" id="gal-capacidad" class="form-control" min="1" required>
			                </div>
			                <div class="col-md-6">
			                    <label for="gal-sector" class="form-label">Sector</label>
			                    <select id="gal-sector" class="form-select" required></select>
			                </div>
			            </div>
			            <button type="submit" class="btn btn-success w-100 fw-semibold">Guardar Galpón</button>
			        </form>

			        <div class="table-responsive">
			            <table class="table table-hover align-middle">
			                <thead class="table-light">
			                    <tr><th>ID</th><th>Galpón</th><th>Estado</th><th>Sector</th></tr>
			                </thead>
			                <tbody id="tb-galpones"></tbody>
			            </table>
			        </div>
			    </div>
			</div>

			<!-- 4. LoteGalpon (Distribución con Cascada Interactiva) -->
			<div class="col-lg-6">
			    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
			        <h5 class="fw-bold mb-3 text-secondary">Distribución Aves en Galpón</h5>
			        <form id="form-lote-galpon">
			            <div class="mb-3">
			                <label for="lg-lote" class="form-label">Seleccionar Lote</label>
			                <select id="lg-lote" class="form-select" required>
			                    <option value="">Seleccione Lote</option>
			                </select>
			            </div>
			            
			            <div class="mb-3">
			                <label for="lg-cantidad" class="form-label">Cantidad de Aves (Automático del Lote)</label>
			                <input type="number" id="lg-cantidad" class="form-control bg-light" readonly required>
			            </div>

			            <div class="mb-3">
			                <label for="lg-sector-filtro" class="form-label">Filtrar por Sector</label>
			                <select id="lg-sector-filtro" class="form-select" required>
			                    <option value="">Seleccione Sector</option>
			                </select>
			            </div>

			            <div class="mb-3">
			                <label for="lg-galpon" class="form-label">Galpón Disponible</label>
			                <select id="lg-galpon" class="form-select" required>
			                    <option value="">Primero seleccione un sector</option>
			                </select>
			            </div>

			            <div class="mb-3">
			                <label for="lg-fecha" class="form-label">Fecha de Asignación</label>
			                <input type="date" id="lg-fecha" class="form-control" required>
			            </div>

			            <button type="submit" class="btn btn-success w-100 fw-semibold py-2">Asignar Aves a Galpón</button>
			        </form>
			    </div>
			</div>

            <!-- 3. LoteAves -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
                    <h5 class="fw-bold mb-3 text-secondary">Lotes de Aves</h5>
                    <form id="form-lote" class="mb-4">
                        <div class="mb-3">
                            <label class="form-label">Guía del Lote</label>
                            <div class="input-group">
                                <input type="text" id="lote-guia-cod" class="form-control" placeholder="000" maxlength="3" required style="max-width: 80px;">
                                <span class="input-group-text">-</span>
                                <input type="text" id="lote-guia-num" class="form-control" placeholder="0000" maxlength="4" required>
                                <button type="button" id="btn-verificar-guia" class="btn btn-primary fw-semibold">Verificar</button>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <label for="lote-cant-aves" class="form-label">Cant. Aves</label>
                                <input type="number" id="lote-cant-aves" class="form-control bg-light" readonly required>
                            </div>
                            <div class="col-md-4">
                                <label for="lote-dias-nacido" class="form-label">Días Nacido</label>
                                <input type="number" id="lote-dias-nacido" class="form-control bg-light" readonly required>
                            </div>
                            <div class="col-md-4">
                                <label for="lote-raza" class="form-label">Raza Ave</label>
                                <input type="text" id="lote-raza" class="form-control bg-light" readonly required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="lote-fecha-ingreso" class="form-label">Fecha Ingreso</label>
                            <input type="date" id="lote-fecha-ingreso" class="form-control bg-light" readonly required>
                        </div>
                        <button type="submit" id="btn-guardar-lote" class="btn btn-success w-100 fw-semibold" disabled>Guardar Lote</button>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Guía</th><th>Cant. Aves</th><th>Días nacido</th><th>Raza ave</th></tr>
                            </thead>
                            <tbody id="tb-lotes"></tbody>
                        </table>
                    </div>
                </div>
            </div>


        </div>
    </div>
	<div class="row mt-4">
	    <div class="col-12">
	        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
	            <h5 class="fw-bold mb-3 text-secondary">Selección Interactiva de Galpones por Sector</h5>
	            <div id="contenedor-sectores-galpones" class="d-flex flex-column gap-4">
	                <!-- Aquí se inyectarán dinámicamente los sectores y sus galpones en tarjetas -->
	            </div>
	        </div>
	    </div>
	</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/infraestructura.js}" src="/js/infraestructura.js"></script>
</body>
</html>
