<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción - La Granja 2 Huevitos</title>
    
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white border-bottom px-4 py-3 mb-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-success fs-4">🥚 La Granja 2 Huevitos</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small">Usuario: <strong th:text="${username}">Usuario</strong></span>
                <a th:href="@{/menu}" class="btn btn-outline-success btn-sm">Menú Principal</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h3 class="fw-bold text-success mb-4">📊 Módulo 4: Producción</h3>

        <div class="row g-4">
            <!-- 1. Formulario y Tabla de TipoHuevo -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                    <h5 class="fw-bold mb-3 text-secondary">Catálogo Tipos de Huevo</h5>
                    <form id="form-tipo-huevo" class="mb-3">
                        <div class="mb-2">
                            <input type="text" id="th-nombre" class="form-control" placeholder="Nombre (Ej: Extra, Primera)" required>
                        </div>
                        <div class="mb-2">
                            <input type="text" id="th-descripcion" class="form-control" placeholder="Descripción / Calibre">
                        </div>
                        <button type="submit" class="btn btn-outline-success w-100 fw-semibold btn-sm">Registrar Tipo Huevo</button>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Nombre</th><th>Descripción</th></tr>
                            </thead>
                            <tbody id="tb-tipos-huevo"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 2. Registro ProduccionGalpon y DetalleProduccion -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3 text-secondary">Registro Diario por Galpón</h5>
                    <form id="form-produccion">
                        <div class="mb-3">
                            <label for="prod-fecha" class="form-label">Fecha de Recolección</label>
                            <input type="date" id="prod-fecha" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="prod-galpon" class="form-label">Galpón</label>
                            <select id="prod-galpon" class="form-select" required></select>
                        </div>

                        <div class="card bg-light border-0 p-3 mb-3">
                            <h6 class="fw-bold text-dark mb-2">Detalle por Clasificación</h6>
                            <div id="contenedor-tipos-huevo" class="d-flex flex-column gap-2"></div>
                        </div>

                        <div class="mb-3">
                            <label for="prod-observacion" class="form-label">Observaciones</label>
                            <textarea id="prod-observacion" class="form-control" rows="2" placeholder="Detalles de recolección..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Guardar Producción</button>
                    </form>
                </div>
            </div>

            <!-- 3. ProduccionSector (Resumen Consolidado) -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3 text-secondary">Resumen Por Sector</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr><th>Fecha</th><th>Sector</th><th class="text-end">Total Huevos</th></tr>
                            </thead>
                            <tbody id="tb-produccion-sector"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/produccion.js}" src="/js/produccion.js"></script>
</body>
</html>
