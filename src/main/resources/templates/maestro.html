<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mantenimiento | Granja 2 Huevitos</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/js/maestro.js}" defer></script>
</head>
<body class="bg-light">
    <nav class="navbar bg-white border-bottom px-4 py-3 mb-4" aria-label="Principal">
        <div class="container-fluid">
            <h1 class="navbar-brand fw-bold text-success fs-4 mb-0">Mantenimiento</h1>
            <a th:href="@{/menu}" class="btn btn-outline-success btn-sm">Volver al Menú</a>
        </div>
    </nav>
    <main class="container my-4">
        <p class="text-secondary">Mantenimiento de tablas de la granja.</p>
        <nav class="nav nav-pills mb-4" aria-label="Tablas maestras">
            <a class="nav-link active" href="#tipo-huevo" aria-current="page">TIPO DE HUEVO</a>
        </nav>
        <div id="maestro-mensaje" class="alert d-none" role="status" aria-live="polite"></div>
        <section id="tipo-huevo" aria-label="Tipo de huevo" class="row g-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <h5>Catálogo de tipos de huevo</h5>
                        <form id="form-tipo-huevo">
                            <p id="th-modo" class="fw-bold d-none" aria-live="polite"></p>
                            <label for="th-nombre" class="form-label">Nombre</label>
                            <input id="th-nombre" class="form-control mb-2" required maxlength="100" placeholder="Ej.: Extra, Primera">
                            <label for="th-descripcion" class="form-label">Descripción / calibre</label>
                            <input id="th-descripcion" class="form-control mb-3">
                            <button class="btn btn-outline-success w-100" type="submit">Registrar tipo de huevo</button>
                        <button id="th-cancelar" class="btn btn-outline-secondary w-100 mt-2 d-none" type="button">Cancelar edición</button></form>
                        <div class="table-responsive mt-3"><table class="table table-sm">
                            <thead><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody id="tb-tipos-huevo"></tbody>
                        </table></div>
                    </div>
                </div>
        </section>
    </main>
</body>
</html>
