<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Granja 2 Huevitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/login.js}" defer></script>
</head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row g-0 login-shell w-100 overflow-hidden shadow-lg">
        <section class="col-lg-6 brand-panel d-flex flex-column justify-content-between p-4 p-md-5 text-white">
            <div class="brand-mark"><span aria-hidden="true">●</span> Granja 2 Huevitos</div>
            <div>
                <p class="text-uppercase small fw-semibold letter-spacing mb-3">Sistema de gestión</p>
                <h1 class="display-5 fw-bold lh-sm mb-3">Todo tu trabajo, en un solo lugar.</h1>
                <p class="brand-copy mb-0">Ingresa con tu cuenta para acceder al panel de la granja.</p>
            </div>
            <small class="brand-footer">Gestión simple para cada jornada.</small>
        </section>
        <section class="col-lg-6 bg-white d-flex align-items-center p-4 p-md-5">
            <div class="form-wrap w-100 mx-auto">
                <span class="eyebrow">Bienvenido de nuevo</span>
                <h2 class="fw-bold mt-2 mb-2">Iniciar sesión</h2>
                <p class="text-secondary mb-4">Introduce tus credenciales para continuar.</p>
                <div id="login-error" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario</label>
                        <input id="username" name="username" type="text" class="form-control form-control-lg"
                               autocomplete="username" maxlength="50" required autofocus placeholder="Tu usuario">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <input id="password" name="password" type="password" class="form-control form-control-lg"
                               autocomplete="current-password" required placeholder="Tu contraseña">
                    </div>
                    <button id="login-button" type="submit" class="btn btn-success btn-lg w-100">
                        <span id="login-spinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                        <span id="login-button-text">Ingresar</span>
                    </button>
                </form>
                <p class="text-secondary small text-center mt-4 mb-0">¿Necesitas acceso? Contacta al administrador.</p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
