<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Independiente - Guardia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-warning text-dark py-3">
      <h4 class="mb-0"><i class="bi bi-shield-check me-2"></i>Programación de Guardias</h4>
    </div>
    <div class="card-body">
      <!-- FORMULARIO INDEPENDIENTE GUARDIA -->
      <form id="formGuardia" onsubmit="guardarGuardia(event)">
        <input type="hidden" id="guardia_index">
        <div class="row g-3">
          <div class="col-md-3">
            <label for="guardia_id" class="form-label font-monospace">ID Guardia *</label>
            <input type="number" class="form-control" id="guardia_id" required placeholder="Ej: 801">
          </div>
          <div class="col-md-5">
            <label for="guardia_personal" class="form-label">Personal de Vigilancia (Tipo GUARDIA) *</label>
            <select class="form-select" id="guardia_personal" required>
              <!-- Filtrado estrictamente para personal de tipo GUARDIA -->
            </select>
          </div>
          <div class="col-md-4">
            <label for="guardia_turno" class="form-label">Turno Asignado *</label>
            <select class="form-select" id="guardia_turno" required>
              <option value="" disabled selected>Seleccione turno...</option>
              <option value="MAÑANA">MAÑANA (06:00 - 14:00)</option>
              <option value="TARDE">TARDE (14:00 - 22:00)</option>
              <option value="NOCHE">NOCHE (22:00 - 06:00)</option>
            </select>
          </div>
          <!--
          <div class="col-md-6">
            <label for="guardia_fechaInicio" class="form-label">Fecha Inicio Guardia *</label>
            <input type="date" class="form-control" id="guardia_fechaInicio" required>
          </div>
          <div class="col-md-6">
            <label for="guardia_fechaFin" class="form-label">Fecha Fin Guardia *</label>
            <input type="date" class="form-control" id="guardia_fechaFin" required>
          </div>
          -->
          <div class="col-12 text-end mt-3">
            <button type="button" class="btn btn-outline-secondary me-2" onclick="limpiarFormGuardia()">
              <i class="bi bi-x-circle me-1"></i> Cancelar
            </button>
            <button type="submit" class="btn btn-warning" id="btnGuardarGuardia">
              <i class="bi bi-save me-1"></i> Programar Guardia
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- TABLA DE REGISTROS -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3">
      <h5 class="mb-0 text-secondary">Programación de Turnos de Vigilancia</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Guardia Responsable</th>
              <th>Turno</th>
              <th>Período Vigencia</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaGuardiaBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let listaPersonal = JSON.parse(localStorage.getItem('db_personal')) || [];
  let listaGuardias = JSON.parse(localStorage.getItem('db_guardias')) || [];

  function cargarComboGuardias() {
    const select = document.getElementById('guardia_personal');
    select.innerHTML = '<option value="" disabled selected>Seleccione Guardia...</option>';
    
    // Filtrado relacional estricto: Solo personal con tipo GUARDIA
    const guardiasDisponibles = listaPersonal.filter(p => p.tipo === 'GUARDIA');
    
    if (guardiasDisponibles.length === 0) {
      select.innerHTML = '<option value="" disabled>No hay personal registrado como GUARDIA</option>';
      return;
    }

    guardiasDisponibles.forEach(g => {
      select.innerHTML += `<option value="${g.idPersonal}">${g.nombres} ${g.apellidos}</option>`;
    });
  }

  function renderTablaGuardia() {
    const tbody = document.getElementById('tablaGuardiaBody');
    tbody.innerHTML = '';
    if (listaGuardias.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">No hay guardias programadas.</td></tr>`;
      return;
    }
    listaGuardias.forEach((item, index) => {
      const g = listaPersonal.find(x => x.idPersonal == item.idPersonal);
      const nombreGuardia = g ? `${g.nombres} ${g.apellidos}` : `ID: ${item.idPersonal} (No encontrado)`;
      tbody.innerHTML += `
        <tr>
          <td class="fw-bold">${item.idGuardia}</td>
          <td>${nombreGuardia}</td>
          <td><span class="badge bg-dark">${item.turno}</span></td>
          <td><small>${item.fechaInicio} al ${item.fechaFin}</small></td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning me-1" onclick="editarGuardia(${index})"><i class="bi bi-pencil"></i> Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="eliminarGuardia(${index})"><i class="bi bi-trash"></i> Eliminar</button>
          </td>
        </tr>`;
    });
  }

  function guardarGuardia(e) {
    e.preventDefault();
    const idx = document.getElementById('guardia_index').value;
    const data = {
      idGuardia: document.getElementById('guardia_id').value,
      idPersonal: document.getElementById('guardia_personal').value,
      turno: document.getElementById('guardia_turno').value,
      fechaInicio: document.getElementById('guardia_fechaInicio').value,
      fechaFin: document.getElementById('guardia_fechaFin').value
    };

    if (idx === "") {
      if (listaGuardias.some(g => g.idGuardia == data.idGuardia)) {
        alert("El ID de Guardia ya existe.");
        return;
      }
      listaGuardias.push(data);
    } else {
      listaGuardias[idx] = data;
    }

    localStorage.setItem('db_guardias', JSON.stringify(listaGuardias));
    limpiarFormGuardia();
    renderTablaGuardia();
  }

  function editarGuardia(index) {
    const item = listaGuardias[index];
    document.getElementById('guardia_index').value = index;
    document.getElementById('guardia_id').value = item.idGuardia;
    document.getElementById('guardia_id').disabled = true;
    document.getElementById('guardia_personal').value = item.idPersonal;
    document.getElementById('guardia_turno').value = item.turno;
    document.getElementById('guardia_fechaInicio').value = item.fechaInicio;
    document.getElementById('guardia_fechaFin').value = item.fechaFin;
    document.getElementById('btnGuardarGuardia').innerHTML = '<i class="bi bi-check-circle me-1"></i> Actualizar Guardia';
  }

  function eliminarGuardia(index) {
    if (confirm("¿Desea eliminar esta programación de guardia?")) {
      listaGuardias.splice(index, 1);
      localStorage.setItem('db_guardias', JSON.stringify(listaGuardias));
      renderTablaGuardia();
    }
  }

  function limpiarFormGuardia() {
    document.getElementById('formGuardia').reset();
    document.getElementById('guardia_index').value = "";
    document.getElementById('guardia_id').disabled = false;
    document.getElementById('btnGuardarGuardia').innerHTML = '<i class="bi bi-save me-1"></i> Programar Guardia';
  }

  document.addEventListener('DOMContentLoaded', () => {
    cargarComboGuardias();
    renderTablaGuardia();
  });
</script>
</body>
</html>
