spring.application.name=SistemaDeGranja2Huevitos
server.port=9099

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:5173}

# Creacion opcional del primer administrador. Nunca se guarda la contrasena en claro.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:admin}


