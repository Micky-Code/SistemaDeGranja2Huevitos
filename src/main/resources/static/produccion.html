<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción - Sistema Avícola</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Control Avícola UPN</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="produccion.html" class="active">Producción</a>
            <a href="almacen.html">Almacén</a>
            <a href="sanidad.html">Sanidad</a>
        </nav>
    </header>

    <main class="container">
        <h2>Módulo de Producción en Galpón</h2>
        
        <form id="form-produccion" class="card">
            <h3>Registro de Recolección Diaria</h3>
            
            <div class="form-group">
                <label for="select-grupo">Grupo de Aves / Galpón:</label>
                <select id="select-grupo" required>
                    <option value="">Seleccione un grupo...</option>
                    <option value="1">Galpón 1 - Camada A (Lote 2026)</option>
                    <option value="2">Galpón 2 - Camada B (Lote 2026)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="input-fecha">Fecha de Recolección:</label>
                <input type="date" id="input-fecha" required>
            </div>

            <h4>Desglose por Clasificación (Unidades)</h4>
            <div class="grid-clasificacion">
                <div class="form-control">
                    <label for="cant-rojo">1. Rojo:</label>
                    <input type="number" id="cant-rojo" min="0" value="0" class="cant-huevo">
                </div>
                <div class="form-control">
                    <label for="cant-pardo">2. Pardo:</label>
                    <input type="number" id="cant-pardo" min="0" value="0" class="cant-huevo">
                </div>
                <div class="form-control">
                    <label for="cant-jumbo">3. Jumbo:</label>
                    <input type="number" id="cant-jumbo" min="0" value="0" class="cant-huevo">
                </div>
                <div class="form-control">
                    <label for="cant-dobleyema">4. Doble Yema:</label>
                    <input type="number" id="cant-dobleyema" min="0" value="0" class="cant-huevo">
                </div>
                <div class="form-control">
                    <label for="cant-poroso">5. Poroso:</label>
                    <input type="number" id="cant-poroso" min="0" value="0" class="cant-huevo">
                </div>
                <div class="form-control">
                    <label for="cant-roto">6. Roto (en Galpón):</label>
                    <input type="number" id="cant-roto" min="0" value="0" class="cant-huevo">
                </div>
            </div>

            <div class="total-box">
                <p><strong>Total Recolectado:</strong> <span id="total-calculado">0</span> huevos</p>
            </div>

            <button type="submit" class="btn-primary">Guardar Registro de Producción</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
