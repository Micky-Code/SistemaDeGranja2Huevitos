<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avícola UPN - Almacén</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Control Avícola UPN</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="produccion.html">Producción</a>
            <a href="almacen.html" class="active">Almacén</a>
            <a href="sanidad.html">Sanidad</a>
        </nav>
    </header>

    <main class="container">
        <h2>Recepción de Producción en Almacén</h2>
        <form class="card-form">
            <div class="form-group">
                <label for="lote-recepcion">Lote / Envío de Galpón:</label>
                <select id="lote-recepcion">
                    <option>ENV-20260905 - Galpón 01 (11,200 huevos)</option>
                </select>
            </div>
            
            <h3>Control de Transporte y Mermas</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="huevos-recibidos">Huevos Recibidos en Buen Estado:</label>
                    <input type="number" id="huevos-recibidos" min="0">
                </div>
                <div class="form-group">
                    <label for="mermas-traslado">Huevos Rotos en Traslado:</label>
                    <input type="number" id="mermas-traslado" min="0" value="0">
                </div>
            </div>

            <div class="form-group">
                <label for="estado-recepcion">Estado del Lote Recibido:</label>
                <select id="estado-recepcion">
                    <option value="conforme">Conforme (Sin novedades)</option>
                    <option value="con_mermas">Con Mermas / Rotos en Traslado</option>
                    <option value="observado">Observado / Rechazado</option>
                </select>
            </div>

            <button type="submit" class="btn">Confirmar Recepción</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
