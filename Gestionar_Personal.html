<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Independiente - Personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0"><i class="bi bi-person-badge-fill me-2"></i>Gestión de Personal</h4>
    </div>
    <div class="card-body">
      <!-- FORMULARIO INDEPENDIENTE PERSONAL -->
      <form id="formPersonal" onsubmit="guardarPersonal(event)">
        <input type="hidden" id="personal_index">
        <div class="row g-3">
          <div class="col-md-3">
            <label for="personal_id" class="form-label font-monospace">ID Personal *</label>
            <input type="number" class="form-control" id="personal_id" required placeholder="Ej: 101">
          </div>
          <div class="col-md-3">
            <label for="personal_nombres" class="form-label">Nombres *</label>
            <input type="text" class="form-control" id="personal_nombres" required placeholder="Juan Carlos">
          </div>
          <div class="col-md-3">
            <label for="personal_apellidos" class="form-label">Apellidos *</label>
            <input type="text" class="form-control" id="personal_apellidos" required placeholder="Pérez Gómez">
          </div>
          <div class="col-md-3">
            <label for="personal_tipo" class="form-label">Tipo de Personal *</label>
            <select class="form-select" id="personal_tipo" required>
              <option value="" disabled selected>Seleccione...</option>
              <option value="OPERARIO">OPERARIO</option>
              <option value="OPERARIO_PIVOTE">OPERARIO_PIVOTE</option>
              <option value="GUARDIA">GUARDIA</option>
              <option value="VETERINARIO">VETERINARIO</option>
            </select>
          </div>
          <div class="col-12 text-end mt-3">
            <button type="button" class="btn btn-outline-secondary me-2" onclick="limpiarFormPersonal()">
              <i class="bi bi-x-circle me-1"></i> Cancelar
            </button>
            <button type="submit" class="btn btn-primary" id="btnGuardarPersonal">
              <i class="bi bi-save me-1"></i> Guardar Personal
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- TABLA DE REGISTROS -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3">
      <h5 class="mb-0 text-secondary">Listado de Personal Registrado</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombres y Apellidos</th>
              <th>Tipo</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaPersonalBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let listaPersonal = JSON.parse(localStorage.getItem('db_personal')) || [];

  function renderTablaPersonal() {
    const tbody = document.getElementById('tablaPersonalBody');
    tbody.innerHTML = '';
    if (listaPersonal.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">No hay registros de personal.</td></tr>`;
      return;
    }
    listaPersonal.forEach((item, index) => {
      tbody.innerHTML += `
        <tr>
          <td class="fw-bold">${item.idPersonal}</td>
          <td>${item.nombres} ${item.apellidos}</td>
          <td><span class="badge bg-info text-dark">${item.tipo}</span></td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning me-1" onclick="editarPersonal(${index})"><i class="bi bi-pencil"></i> Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="eliminarPersonal(${index})"><i class="bi bi-trash"></i> Eliminar</button>
          </td>
        </tr>`;
    });
  }

  function guardarPersonal(e) {
    e.preventDefault();
    const idx = document.getElementById('personal_index').value;
    const data = {
      idPersonal: document.getElementById('personal_id').value,
      nombres: document.getElementById('personal_nombres').value,
      apellidos: document.getElementById('personal_apellidos').value,
      tipo: document.getElementById('personal_tipo').value
    };

    if (idx === "") {
      if (listaPersonal.some(p => p.idPersonal == data.idPersonal)) {
        alert("El ID Personal ya existe.");
        return;
      }
      listaPersonal.push(data);
    } else {
      listaPersonal[idx] = data;
    }

    localStorage.setItem('db_personal', JSON.stringify(listaPersonal));
    limpiarFormPersonal();
    renderTablaPersonal();
  }

  function editarPersonal(index) {
    const item = listaPersonal[index];
    document.getElementById('personal_index').value = index;
    document.getElementById('personal_id').value = item.idPersonal;
    document.getElementById('personal_id').disabled = true;
    document.getElementById('personal_nombres').value = item.nombres;
    document.getElementById('personal_apellidos').value = item.apellidos;
    document.getElementById('personal_tipo').value = item.tipo;
    document.getElementById('btnGuardarPersonal').innerHTML = '<i class="bi bi-check-circle me-1"></i> Actualizar Personal';
  }

  function eliminarPersonal(index) {
    if (confirm("¿Desea eliminar este registro de personal?")) {
      listaPersonal.splice(index, 1);
      localStorage.setItem('db_personal', JSON.stringify(listaPersonal));
      renderTablaPersonal();
    }
  }

  function limpiarFormPersonal() {
    document.getElementById('formPersonal').reset();
    document.getElementById('personal_index').value = "";
    document.getElementById('personal_id').disabled = false;
    document.getElementById('btnGuardarPersonal').innerHTML = '<i class="bi bi-save me-1"></i> Guardar Personal';
  }

  document.addEventListener('DOMContentLoaded', renderTablaPersonal);
</script>
</body>
</html>
